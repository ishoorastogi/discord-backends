services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: database-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BROTHERHOOD_BOT_PASSWORD: ${BROTHERHOOD_BOT_PASSWORD}
      FINANCE_USER_PASSWORD: ${FINANCE_USER_PASSWORD}
      INTERNSHIP_BOT_PASSWORD: ${INTERNSHIP_BOT_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ../schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: