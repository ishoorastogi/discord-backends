[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-parser"
version = "0.1.0"
description = "Extract text from resume PDFs into Python objects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = [
    "exceptions",
    "models",
    "parser",
    "pdf_reader",
    "resume_parser",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/resume_parser"]
